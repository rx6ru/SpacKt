name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOCACHE: /tmp/spackt-go-cache
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - name: Check repository content
        run: go run ./cmd/checkrepo -root .. -mode head
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check races and integration
        run: go test -race -timeout 300s ./...
      - name: Check coverage
        run: |
          go test -coverpkg=./... -coverprofile=/tmp/spackt-coverage.out ./...
          go run ./cmd/checkcoverage -profile /tmp/spackt-coverage.out -min 80
      - name: Check static diagnostics
        run: go vet ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Select npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Check types and lint
        run: |
          npm run typecheck
          npm run lint
      - name: Check tests and coverage
        run: |
          npm run test:coverage
          npm run test:security
      - name: Build static pages
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  containers:
    name: Container browser tests
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Select npm and install test tools
        working-directory: web
        run: |
          npm install --global npm@12.0.2
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Check container configuration
        run: docker compose config --quiet
      - name: Build and start both services
        run: docker compose up --build --wait --wait-timeout 180
      - name: Check browser behavior
        working-directory: web
        env:
          WEB_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8080
        run: npm run test:e2e:container
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans
